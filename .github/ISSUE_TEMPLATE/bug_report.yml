name: 🐛 Bug melden
description: Iets werkt niet zoals het hoort
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bedankt voor je melding. Hoe concreter, hoe sneller we het kunnen oplossen.

  - type: textarea
    id: beschrijving
    attributes:
      label: Wat gaat er mis?
      description: Een korte, duidelijke omschrijving van het probleem.
    validations:
      required: true

  - type: textarea
    id: stappen
    attributes:
      label: Stappen om het te reproduceren
      placeholder: |
        1. Ga naar ...
        2. Klik op ...
        3. Zie foutmelding ...
    validations:
      required: true

  - type: textarea
    id: verwacht
    attributes:
      label: Wat had je verwacht?
    validations:
      required: true

  - type: dropdown
    id: omgeving
    attributes:
      label: Omgeving
      options:
        - Productie
        - Test / staging
        - Lokaal
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blokkerend, ik kan niet verder werken
        - Hinderlijk, er is een omweg
        - Klein, cosmetisch
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser en apparaat
      placeholder: bijv. Chrome op Windows, Safari op iPhone

  - type: textarea
    id: extra
    attributes:
      label: Screenshots of foutmeldingen
      description: Sleep afbeeldingen hierheen of plak de foutmelding. Let op dat er geen klantdata of wachtwoorden in staan.
