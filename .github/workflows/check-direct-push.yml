name: Controle directe push naar main

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Controleer of de wijziging via een pull request kwam
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq 'length')
          if [ "$count" -eq 0 ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "⚠️ Directe push naar main door ${{ github.actor }}" \
              --body "Commit ${{ github.sha }} is direct naar main gepusht zonder pull request. Graag alsnog laten reviewen."
            echo "Directe push gedetecteerd."
            exit 1
          fi
          echo "✅ Wijziging kwam via een pull request."
